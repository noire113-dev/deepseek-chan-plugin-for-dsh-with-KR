# dsh-tts — 옵트인 음성 플러그인.
# deepseek-harness-kr 0.1.5부터 kr 플러그인에 포함되어, kr 설정 창의 "말풍선 음성"에서
# 켜고 설정한다. 이 단독 row는 kr 없이 따로 쓰는 경우에만 필요하며, kr과 함께 켜면
# 같은 라우트가 두 번 등록되므로 둘 중 하나만 쓴다.
# Host half: GET /dsh-tts/state + POST /dsh-tts/speak, a streaming proxy to an
# OpenAI-compatible /audio/speech endpoint. The API key is resolved from the
# credential reference openai.apiKeyEnv (a stored key first, then the env var
# of the same name); it never reaches the browser.
# Client half: plays the PCM stream from a "dsc:say" event and drives
# window.__dsc.voice({speaking, level, until}) from the audio level.
#
# Disabled by default: no routes are registered and the client attaches nothing.

- insert:
    - id: tts
      name: dsh-tts
      config:
        enabled: false
        openai:
          baseUrl: ""           # 예: https://api.openai.com/v1 · https://api.fish.audio/compat/v1 · http://127.0.0.1:8000/v1
          model: ""             # 비우면 요청에서 빼고 서버 기본값을 쓴다
          voice: ""             # 비우면 요청에서 빼고 서버 기본값을 쓴다
          speed: 1.0
          apiKeyEnv: "DSH_TTS_API_KEY"  # credentials 참조 이름. ""이면 인증 없이 요청(무인증 로컬 서버)
          headers: {}
          timeoutMs: 30000
          extraBody: {}         # 모델 전용 필드(비이식성): ref_audio/ref_text 등. 표준 필드가 우선
          textPrefix: ""        # 모델 전용 연출 접두사(비이식성). Drama 3: "[밝고 장난기 있는 20대 여성] "
        stream:
          enabled: true
          pcmSampleRate: 24000
        voiceLines:
          reactions: true
          status: false
          mutters: false
          others: true
        cache:
          enabled: true
          maxEntries: 200
          ttlMs: 604800000
          maxCacheBytes: 33554432
        limits:
          maxCharsPerLine: 300
          maxBytes: 16777216
